name: CI

on:
  pull_request:
    branches: [main]

# Only one CI run per PR branch at a time — cancel in-progress runs on new push.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Build ─────────────────────────────────────────────────────────────
  # ~1-2 min on cache hit, ~5 min cold. Validates the Dockerfile, npm package
  # availability, and that the Chromium apt package still installs cleanly on
  # Debian Bookworm. Built for linux/amd64 (native on CI runners — no QEMU).
  build:
    name: Build image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      artifact: ${{ steps.get-version.outputs.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read version from Dockerfile
        id: get-version
        run: |
          VERSION=$(grep 'ARG CHROME_DEVTOOLS_MCP_VERSION' Dockerfile | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=chrome-devtools-mcp-v${VERSION}-linux-amd64" >> "$GITHUB_OUTPUT"
          echo "Building chrome-devtools-mcp:v$VERSION"

      - name: Build image
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          # Build for linux/amd64 — native on CI runners, no QEMU needed.
          # The compose file targets linux/arm64 for local Apple Silicon use;
          # CI overrides to amd64 for speed. Chromium is available for both.
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max \
            --load \
            --build-arg CHROME_DEVTOOLS_MCP_VERSION="$VERSION" \
            -t "chrome-devtools-mcp:v$VERSION" \
            -t chrome-devtools-mcp:latest \
            .

      # Save the image to a tar archive so the test job can load it without
      # rebuilding. Generate a SHA-256 checksum for provenance validation.
      # Scoped to this workflow run.
      - name: Export image to tar and generate checksum
        run: |
          docker save chrome-devtools-mcp:latest | gzip > /tmp/image.tar.gz
          sha256sum /tmp/image.tar.gz > /tmp/image.tar.gz.sha256
          echo "SHA-256: $(cat /tmp/image.tar.gz.sha256)"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get-version.outputs.artifact }}
          path: |
            /tmp/image.tar.gz
            /tmp/image.tar.gz.sha256
          retention-days: 1

  # ── Job 2: MCP smoke test + Browser probe ────────────────────────────────────
  # Downloads the image artifact once, verifies its SHA-256 checksum, then runs
  # both the MCP initialize smoke test (~30 sec) and the full browser probe
  # (~60 sec) sequentially in a single job.  This avoids downloading and loading
  # the image twice while keeping total runtime shorter than two parallel jobs
  # (each of which paid the artifact-download + docker-load overhead separately).
  test:
    name: MCP smoke test + Browser probe
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: /tmp

      - name: Verify checksum
        run: |
          cd /tmp
          sha256sum -c image.tar.gz.sha256

      - name: Load image
        run: docker load < /tmp/image.tar.gz

      - name: MCP initialize smoke test
        timeout-minutes: 2
        run: |
          python3 - <<'EOF'
          import subprocess, json, sys

          proc = subprocess.Popen(
              [
                  "docker", "run", "--rm", "-i",
                  "--shm-size", "2gb",
                  "--env", "CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS=true",
                  "--env", "CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS=true",
                  "chrome-devtools-mcp:latest",
              ],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )

          def send(msg):
              proc.stdin.write((json.dumps(msg) + "\n").encode())
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  proc.terminate()
                  err = proc.stderr.read().decode()
                  print("STDERR:", err, file=sys.stderr)
                  sys.exit(1)
              return json.loads(line)

          resp = send({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "ci-smoke", "version": "1.0"},
              },
          })

          assert "result" in resp, f"initialize failed: {resp}"
          print("✓ initialize OK:", resp["result"].get("serverInfo", {}))
          proc.terminate()
          EOF

      - name: Browser probe (Chrome launch + navigate)
        timeout-minutes: 3
        run: |
          python3 - <<'EOF'
          import subprocess, json, sys

          proc = subprocess.Popen(
              [
                  "docker", "run", "--rm", "-i",
                  "--shm-size", "2gb",
                  "--env", "CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS=true",
                  "--env", "CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS=true",
                  "chrome-devtools-mcp:latest",
              ],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )

          def send(msg):
              proc.stdin.write((json.dumps(msg) + "\n").encode())
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  proc.terminate()
                  err = proc.stderr.read().decode()
                  print("STDERR:", err, file=sys.stderr)
                  sys.exit(1)
              return json.loads(line)

          def notify(msg):
              # JSON-RPC notifications have no response — do not readline().
              proc.stdin.write((json.dumps(msg) + "\n").encode())
              proc.stdin.flush()

          # Step 1 — MCP handshake
          resp = send({
              "jsonrpc": "2.0", "id": 1, "method": "initialize",
              "params": {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "ci-probe", "version": "1.0"},
              },
          })
          assert "result" in resp, f"initialize failed: {resp}"

          # Notify server that client is ready (no response expected)
          notify({"jsonrpc": "2.0", "method": "notifications/initialized", "params": {}})

          # Step 2 — Discover available tools
          resp = send({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}})
          assert "result" in resp, f"tools/list failed: {resp}"
          tools = {t["name"] for t in resp["result"].get("tools", [])}
          print("Available tools:", sorted(tools))

          # Step 3 — Open a new page (tool name may vary across versions)
          new_page_tool = next(
              (t for t in tools if t in ("new_tab", "new_page", "navigate")),
              None,
          )
          assert new_page_tool, f"No page-creation tool found in: {tools}"

          resp = send({
              "jsonrpc": "2.0", "id": 3,
              "method": "tools/call",
              "params": {"name": new_page_tool, "arguments": {}},
          })
          assert "error" not in resp, f"{new_page_tool} failed: {resp}"
          print(f"✓ {new_page_tool} OK")

          # Step 4 — Navigate (only if new_page_tool was not already navigate)
          if new_page_tool != "navigate" and "navigate" in tools:
              resp = send({
                  "jsonrpc": "2.0", "id": 4,
                  "method": "tools/call",
                  "params": {
                      "name": "navigate",
                      "arguments": {"url": "https://example.com"},
                  },
              })
              assert "error" not in resp, f"navigate failed: {resp}"
              print("✓ navigate OK")

          proc.terminate()
          print("✓ Browser probe passed")
          EOF

  # ── Auto-merge (Renovate PRs only) ──────────────────────────────────────────
  # Runs only when all jobs pass AND the actor is Renovate.
  # GitHub branch protection enforces the required checks before the
  # merge is actually allowed — this step just enables the auto-merge queue.
  auto-merge:
    name: Enable auto-merge for Renovate PRs
    runs-on: ubuntu-latest
    needs: [build, test]
    # Check PR author, not workflow trigger actor — re-runs change github.actor
    # to whoever triggered them, breaking the condition.
    if: github.event.pull_request.user.login == 'renovate[bot]'

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash --repo IgnitedLabs/chrome-devtools-mcp-canister "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
