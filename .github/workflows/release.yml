name: Release

on:
  push:
    branches: [main]
    paths:
      - Dockerfile

jobs:
  tag-and-release:
    name: Tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from Dockerfile
        id: version
        run: |
          VERSION=$(grep 'ARG CHROME_DEVTOOLS_MCP_VERSION' Dockerfile | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag-check
        run: |
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.tag-check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" \
            -m "chrome-devtools-mcp v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set up Docker Buildx
        if: steps.tag-check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build image and generate provenance artefact
        if: steps.tag-check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg CHROME_DEVTOOLS_MCP_VERSION="$VERSION" \
            -t "chrome-devtools-mcp:v$VERSION" \
            -t chrome-devtools-mcp:latest \
            .
          ARCHIVE="chrome-devtools-mcp-v${VERSION}-linux-amd64.tar.gz"
          docker save "chrome-devtools-mcp:v$VERSION" | gzip > "/tmp/$ARCHIVE"
          sha256sum "/tmp/$ARCHIVE" > "/tmp/${ARCHIVE}.sha256"
          echo "SHA-256: $(cat /tmp/${ARCHIVE}.sha256)"
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: steps.tag-check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="chrome-devtools-mcp-v${VERSION}-linux-amd64.tar.gz"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "Packages [chrome-devtools-mcp v${VERSION}](https://www.npmjs.com/package/chrome-devtools-mcp/v/${VERSION})." \
            --latest \
            "/tmp/$ARCHIVE" \
            "/tmp/${ARCHIVE}.sha256"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
